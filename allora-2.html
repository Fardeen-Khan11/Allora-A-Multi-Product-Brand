<!DOCTYPE html>
<html>

<head>

</head>

<body>

    <header>
        <h1 class="logo">ALLORA</h1>
        <p>Everything You Love.</p>
    </header>

    <div class="container my-5">

        <div class="row"> 

            <div class="col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" class="card-img-top"
                        alt="Shoes">
                    <div class="card-body text-center">
                        <h4>Stylish Shoes</h4>
                        <p>₹1,999</p>
                        <button href="Allora-Checkout-Page.html" class="btn btn-shop">Buy Now</button>

                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" class="card-img-top"
                        alt="Watch">
                    <div class="card-body text-center">
                        <h4>Classic Watch</h4>
                        <p>₹1,499</p>
                        <button href="Allora-Checkout-Page.html" class="btn btn-shop">Buy Now</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" class="card-img-top"
                        alt="Headphones">
                    <div class="card-body text-center">
                        <h4>Headphones</h4>
                        <p>₹999</p>
                        <button href="Allora-Checkout-Page.html" class="btn btn-shop">Buy Now</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <h3>ALLORA</h3>
        <p>Everything You Love.</p>
        <p>© 2026 ALLORA | All Rights Reserved</p>
    </footer>
